name: Build iOS IPA (Malaabis)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14 # macOS 14 (Sonoma) on Apple Silicon M1/M2 with Xcode 15/16
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Patch Capacitor Share iOS Plugin for CI Build
        run: |
          python <<'PY'
          from pathlib import Path

          plugin_file = Path("frontend/node_modules/@capacitor/share/ios/Sources/SharePlugin/SharePlugin.swift")
          code = plugin_file.read_text()

          replacements = {
              'if let text = call.getString("text") {': 'if let text = call.options["text"] as? String {',
              'if let url = call.getString("url"), let urlObj = URL(string: url) {': 'if let url = call.options["url"] as? String, let urlObj = URL(string: url) {',
              'let title = call.getString("title")': 'let title = call.options["title"] as? String',
              'if let files = call.getArray("files") {': 'if let files = call.options["files"] as? [Any] {',
              'call.reject("Must provide at least url, text or files")': 'call.errorHandler(CAPPluginCallError(message: "Must provide at least url, text or files", code: nil, error: nil, data: nil))',
              'call.reject("Error sharing item", nil, activityError)': 'call.errorHandler(CAPPluginCallError(message: "Error sharing item", code: nil, error: activityError, data: nil))',
              'call.reject("Share canceled")': 'call.errorHandler(CAPPluginCallError(message: "Share canceled", code: nil, error: nil, data: nil))',
              'call.reject("Can\'t share while sharing is in progress")': 'call.errorHandler(CAPPluginCallError(message: "Can\'t share while sharing is in progress", code: nil, error: nil, data: nil))'
          }

          for old, new in replacements.items():
              if old not in code:
                  raise SystemExit(f"Expected pattern not found in SharePlugin.swift: {old}")
              code = code.replace(old, new)

          plugin_file.write_text(code)
          print(f"Patched {plugin_file}")
          PY

      - name: Sync Capacitor iOS Platform
        run: |
          cd frontend
          npx cap sync ios

      - name: Verify Xcode Project & Schemes
        run: |
          cd frontend/ios/App
          xcodebuild -project App.xcodeproj -list

      - name: Build iOS Release Archive (arm64 for Physical Device)
        run: |
          cd frontend/ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS=""

      - name: Package Payload into Malaabis.ipa
        run: |
          cd frontend/ios/App
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r -y Malaabis.ipa Payload
          ls -lh Malaabis.ipa

      - name: Upload Malaabis.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Malaabis-iOS-IPA
          path: frontend/ios/App/build/Malaabis.ipa
          if-no-files-found: error
          retention-days: 14
