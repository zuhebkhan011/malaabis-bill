name: Build iOS IPA (Malaabis)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14 # macOS 14 (Sonoma) on Apple Silicon M1/M2 with Xcode 15/16
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Latest Xcode 16 Toolchain
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Clean Xcode Caches
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/org.swift.swiftpm

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor iOS Platform
        run: |
          cd frontend
          npx cap sync ios

      - name: Resolve Swift Package Manager Dependencies
        run: |
          cd frontend/ios/App
          xcodebuild -project App.xcodeproj -scheme App -resolvePackageDependencies

      - name: Verify Xcode Project & Schemes
        run: |
          cd frontend/ios/App
          xcodebuild -project App.xcodeproj -list

      - name: Build iOS Release Archive (arm64 for Physical Device)
        run: |
          cd frontend/ios/App
          set -o pipefail
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" 2>&1 | tee build.log

      - name: Print Error Summary on Failure
        if: failure()
        run: |
          cd frontend/ios/App
          node -e '
          const fs = require("fs");
          if (fs.existsSync("build.log")) {
            const lines = fs.readFileSync("build.log", "utf8").split("\n");
            const errors = lines.filter(l => l.includes("error:"));
            console.log("=== TOTAL ERRORS FOUND: " + errors.length + " ===");
            for (const err of errors.slice(0, 20)) {
              console.log("::error::" + err.trim());
            }
          }
          '

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: frontend/ios/App/build.log
          if-no-files-found: ignore

      - name: Package Payload into Malaabis.ipa
        run: |
          cd frontend/ios/App
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r -y Malaabis.ipa Payload
          ls -lh Malaabis.ipa

      - name: Upload Malaabis.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Malaabis-iOS-IPA
          path: frontend/ios/App/build/Malaabis.ipa
          if-no-files-found: error
          retention-days: 14
